name: Build Athar Android Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: 🚀 Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - name: 🛠️ Scaffold Android Platform
        run: |
          echo "Generating clean Android scaffold..."
          flutter create . --org sa.athar --project-name athar_app --platforms android

      - name: 📦 Get Dependencies
        run: flutter pub get

      - name: 🔨 Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Athar-App-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
