name: Build Athar Android Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # يتيح تشغيل البناء يدوياً بضغطة زر واحدة

jobs:
  build-apk:
    name: 🚀 Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🐦 Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🛠️ Generate Android Project Scaffold
        run: |
          if [ ! -d "android" ]; then
            echo "Generating Android native scaffold..."
            flutter create . --org sa.athar --project-name athar_app --platforms android
          fi

      - name: 🌐 Add Internet Permission to AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
              sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>' "$MANIFEST"
            fi
          fi

      - name: 📦 Get Flutter Dependencies
        run: flutter pub get

      - name: 🔨 Build Release APK
        run: flutter build apk --release

      - name: 📤 Upload Release APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Athar-App-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: 🏷️ Publish GitHub Release (Optional Direct Link)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          name: "تطبيق أثر السياحي - الإصدار النهائي"
          body: "تطبيق أثر السياحي للمدينة المنورة (Android Release APK) جاهز للتثبيت المباشر."
          tag_name: v1.0.0-${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
